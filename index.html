<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; }
  .wrap { display: inline-flex; align-items: center; gap: 16px; padding: 12px 20px;
          border: 1px solid #e0e0e0; border-radius: 10px; background: #fff; }
  .lbl { font-size: 13px; color: #666; white-space: nowrap; }
  .blocks { display: flex; gap: 8px; align-items: center; }
  .block { text-align: center; }
  .num { font-size: 22px; font-weight: 500; color: #111; line-height: 1; }
  .unit { font-size: 11px; color: #888; margin-top: 2px; }
  .sep { font-size: 18px; color: #aaa; margin-bottom: 14px; }
  .date-lbl { font-size: 12px; color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">📞 Next call</span>
  <div class="blocks">
    <div class="block"><div class="num" id="d">--</div><div class="unit">days</div></div>
    <span class="sep">:</span>
    <div class="block"><div class="num" id="h">--</div><div class="unit">hrs</div></div>
    <span class="sep">:</span>
    <div class="block"><div class="num" id="m">--</div><div class="unit">min</div></div>
  </div>
  <span class="date-lbl">02 Sep 2026</span>
</div>
<script>
  const target = new Date('2026-09-02T11:00:00Z');
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const diff = target - Date.now();
    const d = Math.floor(diff/86400000);
    const h = Math.floor((diff%86400000)/3600000);
    const m = Math.floor((diff%3600000)/60000);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = pad(h);
    document.getElementById('m').textContent = pad(m);
  }
  tick(); setInterval(tick, 60000);
</script>
</body>
</html>
